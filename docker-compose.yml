version: '3.8'

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janvani-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_GROQ_API_KEY: ${VITE_GROQ_API_KEY}
    container_name: janvani-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped